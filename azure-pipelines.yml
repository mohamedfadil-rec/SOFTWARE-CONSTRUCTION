# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
data:
  input_path: "data/input.csv"
  output_path: "results/"

preprocessing:
  dropna: true
  fill_missing: "mean"        # options: mean, median, mode
  normalization: true         # scale numeric values between 0 and 1
  remove_duplicates: true

analysis:
  method: "summary"           # options: summary, correlation, groupby
  target_column: "value"
  groupby_column: "category"

visualization:
  enabled: true
  type: "bar"                 # options: bar, line, pie, histogram
  x_column: "category"
  y_column: "value"
  title: "Category Analysis"
  save: true
  save_format: "png"

logging:
  level: "info"               # options: debug, info, warning, error
  save_logs: true
  log_file: "results/run.log"

execution:
  mode: "batch"
  save_intermediate: false
  overwrite_output: true